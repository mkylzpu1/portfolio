backend:
  name: github
  repo: mkylzpu1/portfolio
  branch: main
  base_url: https://sveltia-cms-auth.mkylzpu123.workers.dev

media_folder: "public/image"
public_folder: "/image"
site_url: 'https://mkylzpu1.github.io/portfolio/'

locale: ja
i18n:
  structure: multiple_folders
  locales: [ja, en]
  default_locale: ja

collections:
  - name: projects
    label: "制作物 (Projects)"
    label_singular: "制作物"
    folder: "src/content/projects"
    create: true
    delete: true
    slug: "{{fields.id}}"
    identifier_field: id
    extension: json
    format: json
    i18n: true
    fields:
      - label: "ID (URLスラッグ)"
        name: id
        widget: string
        i18n: duplicate
        hint: "半角英数とハイフンのみ。例: pasha-ten（日英で同じ値にする）"

      - label: "カテゴリ"
        name: category
        widget: select
        i18n: duplicate
        options:
          - { label: "アプリ", value: app }
          - { label: "効率化ツール", value: tool }
          - { label: "HP / ブログ", value: hp }

      - label: "サムネイル画像"
        name: image
        widget: image
        i18n: duplicate

      - label: "詳細ページ用画像（任意）"
        name: detailImage
        widget: image
        required: false
        i18n: duplicate

      - label: "URL (/xxx)"
        name: url
        widget: string
        i18n: duplicate

      - label: "アプリURL（任意）"
        name: appUrl
        widget: string
        required: false
        i18n: duplicate

      - label: "リポジトリURL（任意）"
        name: repoUrl
        widget: string
        required: false
        i18n: duplicate

      - label: "タイトル"
        name: title
        widget: string
        i18n: true

      - label: "説明（一覧カード用）"
        name: description
        widget: text
        i18n: true

      - label: "タグ / 使用技術"
        name: tags
        widget: list
        i18n: true

      - label: "概要（詳細ページ）"
        name: overviewDesc
        widget: text
        i18n: true

      # ── 新設：アピールポイント（任意・目安3つ） ──────────────────
      # highlights がない場合はセクション自体が非表示になります
      - label: "アピールポイント（任意）"
        name: highlights
        widget: list
        required: false
        i18n: true
        hint: "特にアピールしたい点を3つ程度。未入力の場合はセクションを非表示。"
        fields:
          - { label: "見出し", name: title, widget: string }
          - { label: "詳細", name: desc, widget: text }

      # ── 既存：開発プロセス（タイムライン）任意に変更 ─────────────
      # timeline がない場合はセクション自体が非表示になります
      - label: "開発プロセス（タイムライン・任意）"
        name: timeline
        widget: list
        required: false
        i18n: true
        hint: "開発の流れをステップで記載。未入力の場合はセクションを非表示。"
        fields:
          - { label: "見出し", name: flag, widget: string }
          - { label: "詳細", name: desc, widget: text }

      # ── 新設：スクリーンショット（任意・ロケール非依存） ────────
      # 画像パスのみのため i18n: duplicate（ja 側の値を使用）
      # screenshots がない場合はセクション自体が非表示になります
      - label: "スクリーンショット（任意）"
        name: screenshots
        widget: list
        required: false
        i18n: duplicate
        hint: "追加で見せたい画像。キャプションは任意。未入力の場合はセクションを非表示。"
        fields:
          - { label: "画像", name: image, widget: image }
          - { label: "キャプション（任意）", name: caption, widget: string, required: false }
